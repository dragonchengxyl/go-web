name: Deploy to Server

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag to deploy
        required: true
        default: main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 600s
          script: |
            set -euo pipefail
            cd /opt/furry-app

            echo "📦 拉取最新代码..."
            git pull origin main

            export BACKEND_IMAGE="ghcr.io/${{ github.repository }}/backend:${{ github.event.inputs.image_tag }}"
            export FRONTEND_IMAGE="ghcr.io/${{ github.repository }}/frontend:${{ github.event.inputs.image_tag }}"

            echo "🐳 拉取容器镜像..."
            sudo docker compose --env-file .env.prod -f docker-compose.prod.yml pull backend frontend

            echo "🗄️ 执行数据库迁移..."
            sudo docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm migrate

            echo "🚀 启动应用容器..."
            sudo docker compose --env-file .env.prod -f docker-compose.prod.yml up -d backend frontend

            echo "🩺 检查容器健康..."
            curl -sf http://127.0.0.1:18080/health > /dev/null && echo "✓ 后端运行正常"
            curl -sf http://127.0.0.1:13000/ > /dev/null && echo "✓ 前端运行正常"

            echo "✅ 部署完成！"
