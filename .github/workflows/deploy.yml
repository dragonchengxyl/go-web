name: Deploy to Server

on:
  workflow_run:
    workflows: ["Docker Build"]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag to deploy
        required: true
        default: main

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Resolve image tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "image_tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
            echo "deploy_ref=main" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=sha-$(printf '%s' '${{ github.event.workflow_run.head_sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"
            echo "deploy_ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 600s
          command_timeout: 40m
          script: |
            set -euo pipefail
            cd /opt/furry-app

            echo "📦 同步部署代码..."
            git fetch origin main --tags
            git checkout "${{ steps.vars.outputs.deploy_ref }}"

            export IMAGE_TAG="${{ steps.vars.outputs.image_tag }}"
            export BACKEND_IMAGE="ghcr.io/${{ github.repository }}/backend:${IMAGE_TAG}"
            export FRONTEND_IMAGE="ghcr.io/${{ github.repository }}/frontend:${IMAGE_TAG}"
            export KAFKA_IMAGE="ghcr.io/${{ github.repository }}/kafka:${IMAGE_TAG}"

            echo "🏷️ 使用镜像标签: ${IMAGE_TAG}"

            echo "🐳 拉取容器镜像..."
            sudo --preserve-env=BACKEND_IMAGE,FRONTEND_IMAGE,KAFKA_IMAGE,IMAGE_TAG docker compose --env-file .env.prod -f docker-compose.prod.yml pull backend frontend

            echo "🗄️ 执行数据库迁移..."
            sudo --preserve-env=BACKEND_IMAGE,FRONTEND_IMAGE,KAFKA_IMAGE,IMAGE_TAG docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm migrate

            echo "🚀 启动应用容器..."
            sudo --preserve-env=BACKEND_IMAGE,FRONTEND_IMAGE,KAFKA_IMAGE,IMAGE_TAG docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --force-recreate backend frontend

            if grep -q '^STUDIO_KAFKA_ENABLED=true' .env.prod; then
              echo "🧵 Kafka 事件总线已启用，启动异步事件服务..."

              if grep -q '^STUDIO_KAFKA_BROKERS=$' .env.prod || ! grep -q '^STUDIO_KAFKA_BROKERS=' .env.prod; then
                sudo --preserve-env=BACKEND_IMAGE,FRONTEND_IMAGE,KAFKA_IMAGE,IMAGE_TAG docker compose --env-file .env.prod -f docker-compose.prod.yml pull kafka
                sudo --preserve-env=BACKEND_IMAGE,FRONTEND_IMAGE,KAFKA_IMAGE,IMAGE_TAG docker compose --env-file .env.prod -f docker-compose.prod.yml --profile kafka up -d kafka
              fi

              sudo --preserve-env=BACKEND_IMAGE,FRONTEND_IMAGE,KAFKA_IMAGE,IMAGE_TAG docker compose --env-file .env.prod -f docker-compose.prod.yml --profile async up -d outbox-relay notification-svc audio-worker

              if grep -q '^STUDIO_MODERATION_ACCESS_KEY_ID=' .env.prod && ! grep -q '^STUDIO_MODERATION_ACCESS_KEY_ID=$' .env.prod; then
                sudo --preserve-env=BACKEND_IMAGE,FRONTEND_IMAGE,KAFKA_IMAGE,IMAGE_TAG docker compose --env-file .env.prod -f docker-compose.prod.yml --profile async up -d moderation-svc
              fi
            fi

            echo "🩺 检查容器健康..."
            curl -sf http://127.0.0.1:18080/health > /dev/null && echo "✓ 后端运行正常"
            curl -sf http://127.0.0.1:13000/ > /dev/null && echo "✓ 前端运行正常"

            echo "✅ 部署完成！"
