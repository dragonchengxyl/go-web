services:
  kafka:
    image: bitnami/kafka:3.7
    profiles: ["kafka"]
    restart: unless-stopped
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_KRAFT_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - studio

  postgres:
    image: postgres:13-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    shm_size: "256m"
    networks:
      - studio

  redis:
    image: redis:6.2-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--save",
        "900",
        "1",
        "--save",
        "300",
        "10",
        "--loglevel",
        "warning",
        "--requirepass",
        "${REDIS_PASSWORD}"
      ]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - studio

  migrate:
    image: ${BACKEND_IMAGE}
    restart: "no"
    env_file:
      - .env.prod
    command: ["./server", "-config", "configs/config.yaml", "-migrate-only"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - studio

  seed:
    image: ${BACKEND_IMAGE}
    restart: "no"
    env_file:
      - .env.prod
    command:
      [
        "./seed-dev",
        "-config",
        "configs/config.yaml",
        "-mode",
        "${SEED_MODE:-bulk}",
        "-profile",
        "${SEED_PROFILE:-medium}",
        "-namespace",
        "${SEED_NAMESPACE:-bulk}",
        "-seed",
        "${SEED_RANDOM_SEED:-0}"
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./uploads:/app/uploads
    networks:
      - studio

  outbox-relay:
    image: ${BACKEND_IMAGE}
    profiles: ["async"]
    restart: unless-stopped
    env_file:
      - .env.prod
    command: ["./outbox-relay", "-config", "configs/config.yaml"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${STUDIO_OBSERVABILITY_OUTBOX_HTTP_PORT:-18055}:${STUDIO_OBSERVABILITY_OUTBOX_HTTP_PORT:-18055}"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${STUDIO_OBSERVABILITY_OUTBOX_HTTP_PORT:-18055}/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - studio

  notification-svc:
    image: ${BACKEND_IMAGE}
    profiles: ["async"]
    restart: unless-stopped
    env_file:
      - .env.prod
    command: ["./notification-svc", "-config", "configs/config.yaml"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${STUDIO_OBSERVABILITY_NOTIFICATION_HTTP_PORT:-18052}:${STUDIO_OBSERVABILITY_NOTIFICATION_HTTP_PORT:-18052}"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${STUDIO_OBSERVABILITY_NOTIFICATION_HTTP_PORT:-18052}/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - studio

  moderation-svc:
    image: ${BACKEND_IMAGE}
    profiles: ["async"]
    restart: unless-stopped
    env_file:
      - .env.prod
    command: ["./moderation-svc", "-config", "configs/config.yaml"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${STUDIO_OBSERVABILITY_MODERATION_HTTP_PORT:-18053}:${STUDIO_OBSERVABILITY_MODERATION_HTTP_PORT:-18053}"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${STUDIO_OBSERVABILITY_MODERATION_HTTP_PORT:-18053}/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - studio

  audio-worker:
    image: ${BACKEND_IMAGE}
    profiles: ["async"]
    restart: unless-stopped
    env_file:
      - .env.prod
    command: ["./audio-worker", "-config", "configs/config.yaml"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "127.0.0.1:${STUDIO_OBSERVABILITY_AUDIO_WORKER_HTTP_PORT:-18054}:${STUDIO_OBSERVABILITY_AUDIO_WORKER_HTTP_PORT:-18054}"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${STUDIO_OBSERVABILITY_AUDIO_WORKER_HTTP_PORT:-18054}/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - studio

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    env_file:
      - .env.prod
    command: ["./server", "-config", "configs/config.yaml", "-run-migrations=false"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-18080}:8080"
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - studio

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-13000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/', (res) => process.exit(res.statusCode >= 200 && res.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - studio

volumes:
  postgres_data:
  redis_data:
  kafka_data:

networks:
  studio:
    driver: bridge
